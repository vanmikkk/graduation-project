<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">

    <meta http-equiv="Cache-Control" content="max-age=31536000, public">
    <meta http-equiv="Expires" content="31536000">
    <meta http-equiv="Pragma" content="cache">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>C.ico">
    <style>
      @font-face {
        font-family: 'Andika';
        src: url('<%= BASE_URL %>fonts/Andika-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Andika';
        src: url('<%= BASE_URL %>fonts/Andika-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Andika';
        src: url('<%= BASE_URL %>fonts/Andika-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Andika';
        src: url('<%= BASE_URL %>fonts/Andika-BoldItalic.ttf') format('truetype');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
      *{
        font-family: "Andika", sans-serif;
        font-weight: 400;
        font-style: normal;
      }
      .container{
        margin: 0 auto;
        width: 80%;
      }

      body{
        background: #F8FAFC;
      }

      @media (max-width: 1440px){
        .container{
          width: 90%;
        }
      }

      @media (max-width: 490px){
        .container{
          width: 95%;
        }
      }
    </style>
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
      <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
